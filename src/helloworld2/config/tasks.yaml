obgyn_diagnosis_task:
  description: >
    You are Dr. Emily Thompson, performing a comprehensive obstetric/gynecologic assessment for {patient} at City General Hospital.
    Integrate presenting complaint, past medical and obstetric/gynecologic history, medications/allergies,
    vital signs, physical and pelvic exam findings, imaging and lab results, fetal monitoring (if applicable),
    and relevant social/contextual factors. Assume the current year is {current_year}.
    
    NOTE: Your colleague Dr. Michael Park will review your assessment and may ask questions or provide feedback. 
    Be prepared to discuss your reasoning and refine your assessment based on collaborative input.
  expected_output: >
    A structured clinical assessment containing:
      One-line clinical summary (concise problem list)
      Top 3 differential diagnoses ordered by likelihood, each with 2–3 supporting facts and key uncertainties
      Recommended immediate investigations (with purpose and urgency) and any contraindications
      Initial stabilization steps (if applicable) and time-critical interventions
      Definitive management plan (medical, surgical, monitoring), with rationale tied to guidelines and risks/benefits
      Monitoring plan and escalation triggers (what to watch and thresholds for calling senior/ICU/OR)
      Patient counseling points and informed-consent considerations
      Suggested documentation checklist entries (ICD/OPCS codes optional), and recommended communication for handoff
    Format the output as YAML or markdown-styled sections. Avoid patient-identifying free text; use the {patient} placeholder.

  agent: diagnosing_obgyn
  context:
    - triage_task

obgyn_peer_review_task:
  description: >
    You are Dr. Michael Park, reviewing the assessment produced by your colleague Dr. Emily Thompson for {patient}. 
    This is a collaborative peer review session at City General Hospital - you should engage in discussion, not just passive review.
    
    Evaluate diagnostic logic, safety, guideline concordance, and completeness. Identify omissions, risks, and opportunities to improve clarity or care.
    
    IMPORTANT: Engage in a hospital-style consultation with Dr. Thompson:
    1. Ask clarifying questions about their reasoning and management decisions
    2. Challenge assumptions if needed, especially regarding safety concerns
    3. Request additional information if something is unclear
    4. Provide constructive feedback and discuss alternative perspectives
    5. Use the consult_colleague tool to ask questions or raise concerns
    
    After your discussion, provide your peer-review report.
  expected_output: >
    A collaborative peer-review report that includes:
      - Questions asked and discussion points raised with Dr. Thompson
      Overall concordance statement (agree / partially agree / disagree) with brief justification
      For each of the primary report's top 3 diagnoses: concur or revise (provide alternative diagnosis if revising), and provide up to 3 concise reasons for the change
      List of missed or insufficiently addressed issues (eg. red flags, contraindications, alternative tests)
      Specific recommended edits to the management plan (prioritized: urgent, recommended, optional), each with rationale
      Explicit safety concerns and escalation recommendations (who to involve and when)
      Suggested wording edits for critical documentation and patient communication to reduce medico-legal risk
      Summary of the collaborative discussion
    Output must be concise, prioritized, and cite guideline references where relevant.
  
  agent: peer_review_obgyn
  context:
    - obgyn_diagnosis_task

