[project]
name = "helloworld2"
version = "0.1.0"
description = "helloworld2 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.4.1",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "litellm>=1.0.0",
]

[project.scripts]
helloworld2 = "helloworld2.main:run"
run_crew = "helloworld2.main:run"
train = "helloworld2.main:train"
replay = "helloworld2.main:replay"
test = "helloworld2.main:test"
run_with_trigger = "helloworld2.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
